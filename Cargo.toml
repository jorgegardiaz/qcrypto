[package]
name = "qcrypto"
version = "0.3.2"
edition = "2024"
authors = ["Jorge Garcia-Diaz <jgarcidi@ull.edu.es>", "Daniel Escanez-Exposito <jescanez@ull.edu.es>"]
description = "Library for the design, simulation and validation of quantum cryptographic protocols"
keywords = ["quantum", "cryptography", "simulation", "qkd", "physics"]
categories = ["cryptography", "simulation", "science"]
repository = "https://github.com/jorgegardiaz/qcrypto"
readme = "README.md"
license = "MIT OR Apache-2.0"

[lib]
name = "qcrypto"
path = "src/lib.rs"

[features]
default = ["parallel"]
parallel = ["dep:rayon", "ndarray/rayon"]
serde = ["dep:serde", "ndarray/serde", "num-complex/serde"]

[dependencies]
nalgebra = "0.34.1"
ndarray = "0.17.2"
num-complex = "0.4.6"
rand = "0.9.2"
rand_chacha = "0.9.0"
rayon = { version = "1.11.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2.0.18"

[[bench]]
name = "core_ops"
harness = false

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "channels"
harness = false

[[bench]]
name = "protocols"
harness = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1"
